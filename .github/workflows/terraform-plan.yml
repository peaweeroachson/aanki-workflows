name: Terraform plan

on:
    workflow_call:
        inputs:
            working-directory:
                description: Stack to plan, for example stacks/app
                type: string
                required: true
            aws-region:
                type: string
                required: true
            terraform-version:
                type: string
                default: 1.17.1
        secrets:
            AWS_ROLE_ARN:
                description: The read-only plan role, trusting the repo's pull requests
                required: true
            ALERT_EMAIL:
                description: Passed to Terraform as var.alert_email
                required: false

permissions:
    contents: read
    id-token: write
    pull-requests: write

jobs:
    plan:
        # Forks get no OIDC token and no secrets.
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        env:
            TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
            TF_IN_AUTOMATION: "true"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: ${{ inputs.terraform-version }}
                  terraform_wrapper: false

            - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ inputs.aws-region }}

            - run: terraform init -input=false

            # No lock: the read-only role cannot write the state's lock file.
            - name: Plan
              run: terraform plan -input=false -lock=false -no-color > "$RUNNER_TEMP/plan.txt"

            # The comment is public, and an account ID is not to be: redact it before posting.
            - name: Redact
              run: |
                  account=$(aws sts get-caller-identity --query Account --output text)
                  sed --in-place "s/${account}/<account-id>/g" "$RUNNER_TEMP/plan.txt"

            - name: Comment on the pull request
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  STACK: ${{ inputs.working-directory }}
              with:
                  script: |
                      const fs = require('fs');
                      const marker = `<!-- terraform-plan:${process.env.STACK} -->`;
                      let plan = fs.readFileSync(`${process.env.RUNNER_TEMP}/plan.txt`, 'utf8');
                      if (plan.length > 60000) {
                          plan = plan.slice(0, 60000) + '\n... truncated; see the run log';
                      }
                      const body = `${marker}\n### Terraform plan: \`${process.env.STACK}\`\n\`\`\`\n${plan}\n\`\`\``;
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                      const existing = comments.find((c) => c.body.startsWith(marker));
                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }
